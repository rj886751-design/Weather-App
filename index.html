
<!DOCTYPE html> <html> <head> <title>Weather App</title>
<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        margin-top: 100px;
        background-color: #3a4149;
    }

    input {
        padding: 10px;
        width: 200px;
        font-size: 16px;
    }

    button {
        padding: 10px 15px;
        font-size: 16px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
    }

    #result {
        margin-top: 20px;
        font-size: 20px;
        font-weight: bold;
        color: white;
    }

    #mode {
        margin-top: 20px;
    }
</style>

</head> <body>
<h1 style="color: white;">Enter your city/state/country</h1>

<input
    type="text"
    id="location"
    placeholder="Enter city name"
>

<button onclick="getWeather()">Get Weather</button>

<div id="result"></div>

<button id="mode">Mood Change</button>

<script>
    alert("Your personal weather app is ready to use!");

    async function getWeather() {
        const city = document.getElementById("location").value.trim();
        const result = document.getElementById("result");

        if (!city) {
            result.innerHTML = "Please enter a city name!";
            return;
        }

        result.innerHTML = "Loading...";

        try {
            const response = await fetch(
                `/api/weather?city=${encodeURIComponent(city)}`
            );

            const data = await response.json();

            if (!response.ok) {
                result.innerHTML = data.error || "City not found!";
                return;
            }

            const temp = data.current.temp_c;

            result.innerHTML =
                `Temperature in ${city} is ${temp} °C`;

        } catch (error) {
            console.error(error);
            result.innerHTML =
                "Something went wrong. Please try again.";
        }
    }
</script>

</body> </html>
