<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;

            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;

            transition: 0.4s;
        }

        body.light {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            color: #222;
        }

        .container {
            width: 100%;
            max-width: 450px;
        }

        .weather-app {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 30px;
            text-align: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        #location {
            flex: 1;
            min-width: 0;

            padding: 13px 15px;
            border: none;
            outline: none;
            border-radius: 12px;

            font-size: 16px;
        }

        #searchBtn {
            padding: 13px 18px;
            border: none;
            border-radius: 12px;

            background: #007bff;
            color: white;

            font-size: 15px;
            font-weight: bold;
            cursor: pointer;

            transition: 0.3s;
        }

        #searchBtn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        #searchBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        #result {
            display: none;

            margin-top: 15px;
            padding: 25px 20px;

            border-radius: 20px;
            background: rgba(255, 255, 255, 0.1);

            animation: fadeIn 0.4s ease;
        }

        .location-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .temperature {
            font-size: 65px;
            font-weight: bold;
            margin: 10px 0;
        }

        .condition {
            font-size: 18px;
            opacity: 0.85;
            margin-bottom: 10px;
        }

        .weather-icon {
            font-size: 55px;
            margin-bottom: 5px;
        }

        .message {
            margin-top: 15px;
            font-size: 16px;
        }

        .error {
            color: #ffb3b3;
        }

        .theme-btn {
            margin-top: 22px;

            padding: 10px 18px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;

            background: transparent;
            color: inherit;

            cursor: pointer;
            font-size: 14px;

            transition: 0.3s;
        }

        .theme-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.6;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 500px) {

            body {
                padding: 15px;
            }

            .weather-app {
                padding: 25px 18px;
                border-radius: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .search-box {
                flex-direction: column;
            }

            #location,
            #searchBtn {
                width: 100%;
            }

            .temperature {
                font-size: 55px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="weather-app">

            <h1>🌤️ Weather App</h1>

            <p class="subtitle">
                Check the current weather of any city
            </p>

            <form class="search-box" id="weatherForm">

                <input
                    type="text"
                    id="location"
                    placeholder="Enter city name"
                    autocomplete="off"
                >

                <button type="submit" id="searchBtn">
                    Search
                </button>

            </form>

            <div id="result"></div>

            <button class="theme-btn" id="themeBtn">
                🌙 Change Theme
            </button>

            <div class="footer">
                Personal Weather App
            </div>

        </div>

    </div>


    <script>

        const form = document.getElementById("weatherForm");
        const locationInput = document.getElementById("location");
        const result = document.getElementById("result");
        const searchBtn = document.getElementById("searchBtn");
        const themeBtn = document.getElementById("themeBtn");


        form.addEventListener("submit", function(event) {

            event.preventDefault();

            getWeather();

        });


        async function getWeather() {

            const city = locationInput.value.trim();

            if (!city) {

                result.style.display = "block";

                result.innerHTML =
                    `<div class="message error">
                        Please enter a city name!
                    </div>`;

                return;
            }


            result.style.display = "block";

            result.innerHTML =
                `<div class="message">
                    ⏳ Loading weather...
                </div>`;


            searchBtn.disabled = true;
            searchBtn.innerText = "Loading...";


            try {

                const response = await fetch(
                    `/api/weather?city=${encodeURIComponent(city)}`
                );


                const data = await response.json();


                if (!response.ok) {

                    result.innerHTML =
                        `<div class="message error">
                            ❌ ${data.error || "City not found!"}
                        </div>`;

                    return;
                }


                const temperature = data.current.temp_c;


                let condition = "";

                if (data.current.condition) {

                    condition = data.current.condition.text || "";

                }


                let icon = "🌤️";


                if (condition.toLowerCase().includes("rain")) {

                    icon = "🌧️";

                } else if (condition.toLowerCase().includes("cloud")) {

                    icon = "☁️";

                } else if (condition.toLowerCase().includes("sun")) {

                    icon = "☀️";

                } else if (condition.toLowerCase().includes("clear")) {

                    icon = "☀️";

                } else if (condition.toLowerCase().includes("storm")) {

                    icon = "⛈️";

                }


                result.innerHTML = `

                    <div class="weather-icon">
                        ${icon}
                    </div>

                    <div class="location-name">
                        ${city}
                    </div>

                    <div class="temperature">
                        ${temperature}°C
                    </div>

                    <div class="condition">
                        ${condition || "Current Weather"}
                    </div>

                `;


            } catch (error) {

                console.error(error);

                result.innerHTML =
                    `<div class="message error">
                        ❌ Something went wrong.
                        Please try again.
                    </div>`;

            } finally {

                searchBtn.disabled = false;
                searchBtn.innerText = "Search";

            }

        }


        themeBtn.addEventListener("click", function() {

            document.body.classList.toggle("light");


            if (document.body.classList.contains("light")) {

                themeBtn.innerText = "☀️ Dark Theme";

            } else {

                themeBtn.innerText = "🌙 Light Theme";

            }

        });

    </script>

</body>
</html>
